[metadata]
name = x-followers-parser
version = 0.1.0
description = Handles in -> X (Twitter) follower counts out. CLI only, no UI.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/anomalyco/opencode
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Environment :: Console
    Topic :: Internet
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.8

[options.entry_points]
console_scripts =
    x-followers = x_followers_parser.cli:main
